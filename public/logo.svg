<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle with gradient -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)" stroke="white" stroke-width="2"/>
  
  <!-- Inner circle with gradient -->
  <circle cx="100" cy="100" r="80" fill="url(#gradient2)" opacity="0.8"/>
  
  <!-- Letter R -->
  <path d="M 50 150 L 50 60 L 75 60 Q 85 60 85 70 Q 85 80 75 80 L 50 80 M 75 80 L 90 150" fill="white" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Letter S -->
  <path d="M 100 60 L 140 60 Q 150 60 150 70 L 150 75 Q 150 85 140 85 L 100 85 L 110 95 Q 120 95 130 95 L 150 95 Q 160 95 160 105 L 160 140 Q 160 150 150 150 L 110 150 Q 100 150 100 140" fill="white" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Letter P -->
  <path d="M 170 150 L 170 60 L 190 60 Q 200 60 200 70 L 200 100 Q 200 110 190 110 L 170 110" fill="white" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Letter L -->
  <path d="M 50 150 L 50 60" fill="white" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 150 L 85 150" fill="white" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Decorative element -->
  <circle cx="100" cy="100" r="5" fill="white" opacity="0.8"/>
</svg>